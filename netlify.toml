# Netlify — Flutter web (Aris)
#
# Repo = aris-flutter (esta carpeta es la raíz): Base directory en el panel = vacío o "."
# Repo = monorepo aris_flutter_backend: Base directory en el panel = aris_flutter_v0.22
#
# Deploy manual (tras flutter build web --release):
#   npx netlify-cli deploy --prod --dir=build/web --no-build

[build]
  publish = "build/web"
  command = "bash scripts/netlify-build.sh"

[build.environment]
  FLUTTER_VERSION = "stable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
